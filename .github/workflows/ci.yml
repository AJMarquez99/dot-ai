name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # Lint the POSIX shell — dot-ai's "quality" gate (shellcheck), matching the family
  # convention of a required `quality` status check alongside `ci`.
  quality:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh test/install_test.sh

  harness:
    name: installer suite (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Full POSIX harness: exercises BOTH install.sh and bin/cli.js.
      - run: sh test/install_test.sh
      # cli.js smoke (also the Windows path) — belt and suspenders on Unix.
      - run: node test/smoke.js

  package:
    name: pack + install round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/pack-install.js

  windows:
    name: cli.js smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # install.sh can't run natively on Windows; cli.js is the real Windows
      # (npx) path, so smoke-test it directly.
      - run: node test/smoke.js

  # Aggregator → the single required "ci" status check (green only if the whole
  # matrix + package + windows suite passed). `quality` is required separately.
  ci:
    needs: [harness, package, windows]
    runs-on: ubuntu-latest
    steps:
      - run: echo "installer suite green across the matrix"
